<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5aa0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Main Building/Tower Symbol -->
  <g transform="translate(100,100)">
    <!-- Central Tower -->
    <rect x="-8" y="-40" width="16" height="60" fill="white" rx="2"/>
    
    <!-- Side Buildings -->
    <rect x="-25" y="-25" width="12" height="45" fill="rgba(255,255,255,0.8)" rx="1"/>
    <rect x="13" y="-30" width="12" height="50" fill="rgba(255,255,255,0.8)" rx="1"/>
    
    <!-- Decorative Elements -->
    <rect x="-6" y="-35" width="2" height="8" fill="url(#accentGradient)"/>
    <rect x="-2" y="-35" width="2" height="8" fill="url(#accentGradient)"/>
    <rect x="2" y="-35" width="2" height="8" fill="url(#accentGradient)"/>
    
    <!-- Windows -->
    <rect x="-5" y="-25" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="-1" y="-25" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="3" y="-25" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    
    <rect x="-5" y="-15" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="-1" y="-15" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="3" y="-15" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    
    <rect x="-5" y="-5" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="-1" y="-5" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    <rect x="3" y="-5" width="2" height="3" fill="#2c5aa0" rx="0.5"/>
    
    <!-- Digital/Tech Elements -->
    <circle cx="-35" cy="-10" r="3" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="35" cy="-15" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="-30" cy="10" r="2" fill="url(#accentGradient)" opacity="0.8"/>
    <circle cx="30" cy="15" r="2.5" fill="url(#accentGradient)" opacity="0.8"/>
    
    <!-- Connection Lines -->
    <line x1="-32" y1="-10" x2="-25" y2="-15" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="32" y1="-15" x2="25" y2="-20" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="-28" y1="10" x2="-25" y2="5" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
    <line x1="28" y1="15" x2="25" y2="10" stroke="url(#accentGradient)" stroke-width="1" opacity="0.6"/>
    
    <!-- Base Platform -->
    <ellipse cx="0" cy="20" rx="35" ry="8" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- Company Initials -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">م ح</text>
  
  <!-- Decorative Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- Shine Effect -->
  <ellipse cx="80" cy="70" rx="15" ry="25" fill="rgba(255,255,255,0.2)" transform="rotate(-30 80 70)"/>
</svg>